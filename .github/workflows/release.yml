# Publishes on a version tag: npm (with provenance) and a container image.
#
# Publishing from CI rather than a laptop is deliberate. It means the published
# artifact is built from a known commit by a known workflow, npm can attest to
# that with provenance, and no long-lived publish token has to live on anyone's
# machine.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: release

# A manual run publishes ONLY the container image, tagged `edge`. That keeps
# the container releasable on its own — the two registries have separate
# credentials and separate failure modes, and one being blocked should not hold
# the other hostage. No dispatch inputs on purpose: nothing user-supplied
# reaches a tag or a shell.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never publish something that does not pass its own suite. A separate job so
  # a failure here stops both publishes, not just one.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Gate the release on the packaged artifact working, not just the tree.
      - run: npm run test:package

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi

  npm:
    needs: verify
    # Only on a version tag. A manual run is for the container alone.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest
      # which workflow and commit produced the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 22, purely for the npm it ships. Trusted Publishing
      # authenticates over OIDC and needs npm >= 11.5.1; Node 22 bundles
      # 10.9.x, which fails with an error that does not mention the version.
      # Which Node publishes is irrelevant to the artifact — the CI matrix is
      # what proves the package runs on 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm must be new enough for Trusted Publishing
        run: |
          NPM="$(npm --version)"
          MAJOR="${NPM%%.*}"
          REST="${NPM#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "::error title=npm too old for OIDC::npm $NPM cannot use Trusted Publishing (needs >= 11.5.1). Bump node-version, or add 'npm install -g npm@latest' before this step."
            exit 1
          fi
          echo "npm $NPM supports Trusted Publishing"

      - run: npm ci
      - run: npm run build

      # Re-running a release is a normal thing to do — a failed container job,
      # a retried workflow — and it should not hard-fail on the half that
      # already succeeded. npm rejects a duplicate version anyway; this turns
      # that into an explicit skip instead of a red run nobody can act on.
      - id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "wamock@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "wamock@$VERSION is already on npm — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Attempt the publish, and only annotate if it actually fails.
      #
      # Checking for NPM_TOKEN up front would have been wrong: Trusted
      # Publishing authenticates over OIDC and needs no token at all, so a
      # pre-flight check would block the very setup this repo is moving toward.
      # Letting the command decide covers all three cases — token, OIDC, or
      # neither — and a red run still says what to do instead of leaving
      # ENEEDAUTH buried in npm's log.
      - if: steps.published.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm publish --provenance --access public; then
            echo "::error title=npm publish failed::Read npm's error above — it is the specific one. If it says ENEEDAUTH or E401, CI is not authenticated: configure Trusted Publishing at https://www.npmjs.com/package/wamock/access (repository alrashidmtz/wamock, workflow release.yml, allow npm publish), or add an NPM_TOKEN secret. If it says E422 about provenance, package.json and the source repo disagree. To publish by hand meanwhile: npm publish --access public --otp=<code>"
            exit 1
          fi

  container:
    # On a version tag the image must not ship unless npm did: otherwise a
    # partial release leaves the registries disagreeing about what a version
    # is, which happened with 0.2.7 — the image published while npm rejected
    # the manifest. A manual run skips the npm job entirely, and `skipped` is
    # an acceptable result precisely so the container stays releasable alone.
    needs: [verify, npm]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag push: v0.1.0 -> :0.1.0, :0.1, :latest
          # Manual run: :edge only, so a dispatch can never move :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Apple Silicon is common among the developers this targets, so arm64
          # is not optional.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # "It built" is not "it runs". Pull the image that was just pushed and
      # drive a real message through it, so a broken entrypoint or a missing
      # runtime file is caught here rather than by whoever pulls it first.
      - name: Smoke test the published image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          TAG="$(echo "$IMAGE" | head -n1)"
          echo "smoke testing $TAG"
          docker run -d --name wamock-smoke -p 4004:4004 "$TAG" \
            --port=4004 --host=0.0.0.0 --app-secret=smoke --quiet

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4004/__mock/state >/dev/null; then break; fi
            if [ "$i" = "30" ]; then
              echo "image never became ready" >&2
              docker logs wamock-smoke >&2
              exit 1
            fi
            sleep 1
          done

          # A customer writes in, the app replies, the window then expires and
          # the reply is refused — the whole point of the tool, in one run.
          curl -sf -X POST http://127.0.0.1:4004/__mock/inbound \
            -H 'content-type: application/json' \
            -d '{"from":"5215555000001","text":"hola"}' >/dev/null

          curl -sf -X POST http://127.0.0.1:4004/v19.0/PNID_DEFAULT/messages \
            -H 'content-type: application/json' \
            -d '{"messaging_product":"whatsapp","to":"5215555000001","type":"text","text":{"body":"hi"}}' >/dev/null

          curl -sf -X POST http://127.0.0.1:4004/__mock/time/advance \
            -H 'content-type: application/json' -d '{"ms":90000000}' >/dev/null

          CODE="$(curl -s -X POST http://127.0.0.1:4004/v19.0/PNID_DEFAULT/messages \
            -H 'content-type: application/json' \
            -d '{"messaging_product":"whatsapp","to":"5215555000001","type":"text","text":{"body":"x"}}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).error.code))")"

          docker rm -f wamock-smoke >/dev/null
          if [ "$CODE" != "131047" ]; then
            echo "expected 131047 outside the 24h window, got $CODE" >&2
            exit 1
          fi
          echo "amd64 image works: full lifecycle passed, 131047 returned as expected"

      # The runner is amd64, so the step above only ever exercised half of what
      # we publish. QEMU is far too slow to build under, but plenty fast enough
      # to boot an already-built image and confirm it starts and serves —
      # otherwise "multi-arch" is a claim backed by a build log, not a run.
      - name: Smoke test the arm64 image under emulation
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          TAG="$(echo "$IMAGE" | head -n1)"
          docker run -d --name wamock-arm64 --platform linux/arm64 -p 4005:4005 "$TAG" \
            --port=4005 --host=0.0.0.0 --app-secret=smoke --quiet

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4005/__mock/state >/dev/null; then break; fi
            if [ "$i" = "60" ]; then
              echo "arm64 image never became ready" >&2
              docker logs wamock-arm64 >&2
              exit 1
            fi
            sleep 1
          done

          ARCH="$(docker exec wamock-arm64 node -p "process.arch")"
          curl -sf -X POST http://127.0.0.1:4005/__mock/inbound \
            -H 'content-type: application/json' \
            -d '{"from":"5215555000001","text":"hola"}' >/dev/null

          docker rm -f wamock-arm64 >/dev/null
          if [ "$ARCH" != "arm64" ]; then
            echo "expected the arm64 image to report process.arch=arm64, got $ARCH" >&2
            exit 1
          fi
          echo "arm64 image works: booted under emulation, process.arch=$ARCH, accepted an inbound message"
