# wamock alongside the app under test — the shape a CI pipeline wants.
#
# Copy this into your own project and point `app.build` at it. The paths here
# assume it sits next to your Dockerfile.
services:
  wamock:
    # :edge tracks main; pin :x.y.z once you want a fixed version.
    image: ghcr.io/alrashidmtz/wamock:edge
    command:
      - --port=4004
      # Required inside a container; loopback would be unreachable from the
      # host. Safe here because the container boundary limits who can connect.
      - --host=0.0.0.0
      - --app-secret=ci-test-secret
      - --webhook-url=http://app:3000/webhook
      - --quiet
    ports:
      - '4004:4004'
    # No healthcheck here: the image ships one. `service_healthy` below uses it,
    # so the app waits for readiness instead of sleeping — a fixed sleep is
    # either too short on a loaded runner or wasted time on a fast one.

  app:
    # YOUR application. `.` is your project root, not wamock's.
    build: .
    environment:
      # Works only if your Graph client reads a base URL from configuration.
      # Many do not: we checked two production integrations and BOTH built
      # their Graph URLs as string literals. If yours does too, this variable
      # will not help — use `installGraphInterceptor` from `wamock/intercept`
      # inside your tests instead, which swaps the destination underneath a
      # client without modifying it.
      GRAPH_API_BASE_URL: http://wamock:4004
      WHATSAPP_PHONE_NUMBER_ID: PNID_DEFAULT
      WHATSAPP_WABA_ID: WABA_DEFAULT
      WA_APP_SECRET: ci-test-secret
    depends_on:
      wamock:
        condition: service_healthy
